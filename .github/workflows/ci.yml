name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      # The rules core, telemetry and simulator. Includes the golden replays, so an unintended rule change fails here.
      - run: dotnet test core/Tests
      # The simulator must reproduce every committed report, byte for byte, so a rule or content change needs them regenerated.
      - run: dotnet run --project core/Sim -c Release -- conformance
